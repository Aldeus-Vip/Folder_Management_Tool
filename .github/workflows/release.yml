name: release
# v で始まるタグ(例: v1.0.0)を push すると、配布用 zip を作って GitHub Release を作成する。
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: build
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p "pkg/FolderManager_${VER}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${VER}" -o "pkg/FolderManager_${VER}/FolderManager.exe" ./cmd/foldermanager
          cp "docs/はじめにお読みください.txt" RELEASE_NOTES.md "pkg/FolderManager_${VER}/"
          # 日本語のファイル名がWindowsで文字化けしないよう、UTF-8 フラグ付きで圧縮する(Python の zipfile)
          (cd pkg && python3 -m zipfile -c "FolderManager_${VER}.zip" "FolderManager_${VER}")
          echo "VER=${VER}" >> "$GITHUB_ENV"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "pkg/FolderManager_${VER}.zip" --title "FolderManager ${VER}" --notes-file RELEASE_NOTES.md
